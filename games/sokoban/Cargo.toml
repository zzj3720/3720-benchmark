[package]
name = "sokoban-benchmark"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[lib]
name = "sokoban_benchmark"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"

[[bin]]
name = "sokoban-server"
path = "src/bin/server.rs"

[[bin]]
name = "sokoban-verifier"
path = "src/bin/verifier.rs"

[[bin]]
name = "sokoban"
path = "src/bin/client.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
