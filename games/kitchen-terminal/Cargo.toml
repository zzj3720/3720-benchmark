[package]
name = "kitchen-terminal"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"

[[bin]]
name = "kitchen-server"
path = "src/bin/server.rs"

[[bin]]
name = "kitchen-verifier"
path = "src/bin/verifier.rs"

[[bin]]
name = "kitchen-render-qa"
path = "src/bin/render-qa.rs"

[[bin]]
name = "kitchen"
path = "src/bin/client.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
