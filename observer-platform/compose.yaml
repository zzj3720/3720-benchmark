name: benchmark-live
services:
  gateway:
    image: benchmark-live-gateway:${LIVE_RELEASE:-local}
    build:
      context: ..
      dockerfile: observer-platform/Dockerfile
      target: gateway
    init: true
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 2
    pids_limit: 128
    ports:
      - "127.0.0.1:${LIVE_GATEWAY_BIND_PORT:-3740}:3740"
    environment:
      LIVE_LEASE_MODE: ${LIVE_LEASE_MODE:-heartbeat}
      LIVE_DETAIL_CACHE_MIB: "32"
    volumes:
      - ${LIVE_DATA_ROOT:-../.harbor}/run-journals:/data/.harbor/run-journals:ro
      - ${LIVE_DATA_ROOT:-../.harbor}/live-archive:/data/.harbor/live-archive:ro
      - live-cache:/cache
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:3740/health"]
      interval: 5s
      timeout: 4s
      retries: 36
      start_period: 180s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  web:
    image: benchmark-live-web:${LIVE_RELEASE:-local}
    build:
      context: ..
      dockerfile: observer-platform/Dockerfile
      target: web
    init: true
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    pids_limit: 128
    ports:
      - "127.0.0.1:${LIVE_WEB_BIND_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - live-assets:/app/dist/client/assets
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  live-cache:
    name: ${LIVE_CACHE_VOLUME:-benchmark-live-cache-v2}
  live-assets:
    name: ${LIVE_ASSETS_VOLUME:-benchmark-live-assets}
